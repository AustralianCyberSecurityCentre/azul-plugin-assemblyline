[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "azul-plugin-assemblyline"
description = "Compatibity between Azul and Assemblyline."
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["license.md"]
authors = [
  { name="Azul"},
]
requires-python = ">=3.12"
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "assemblyline-client>=4.9.9",
    "azul-runner>=11.0.33",
    "azul-security>=10.0.12",
    "fastapi>=0.128.0",
    "packaging>=26.0",
    "pendulum>=3.2.0",
    "prometheus-client>=0.24.1",
    "pydantic>2",
    "pydantic-settings>2",
    "starlette-exporter>=0.23.0",
    "structlog>=25.5.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
azul-plugin-assemblyline = "azul_plugin_assemblyline.main:main"
azul-plugin-assemblyline-forwarder = "azul_plugin_assemblyline.forwarder:main"

[project.urls]
Documentation = "https://australiancybersecuritycentre.github.io/azul/"
Repository = "https://github.com/AustralianCyberSecurityCentre/azul-plugin-assemblyline"

[tool.uv]
package = true
exclude-newer = "1 week"
exclude-newer-package = { azul-bedrock = false, azul-runner = false, azul-security=false, azul-metastore = false, azul-nsrl-lookup-serve=false, azul-nsrl-lookup-server=false, azul-plugin-retrohunt = false }

[tool.uv.sources]
azul-bedrock = { index="cache"}
azul-runner = { index="cache" }
azul-metastore = { index="cache"}
azul-security = { index="cache"}
azul-nsrl-lookup-server = { index="cache"}
azul-plugin-retrohunt = { index="cache" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "cache"
url = "https://devpi.acsc.internal/azul/stable/"
explicit = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "only-version"

[tool.hatch.version.fallback]
version = "0.0.0"

[dependency-groups]
dev = [
    "azul-runner[test-utils]>=9.0.38",
    "cart>=1.2.3",
    "httpx>=0.28.1",
    "parameterized>=0.9.0",
    "pytest>=9.0.2",
    "starlette>=0.50.0",
    "tox>=4.34.1",
]

[tool.ruff]
# formatter config
line-length = 119
indent-width = 4
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".env",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Flake8 linting equivalent but for ruff
[tool.ruff.lint]
select = [
  # isort
  "I",
  # Code styles
  "E4",
  "E7",
  "E9",
  # pyflakes
  "F",
  # flake8 bug bear
  "B",
  # flake8 doc strings
  "D",
  # bandit
  "S",
]
ignore = ["B008","C901","D104","D107","E203"]
exclude = [
    "tests/*",
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.pydocstyle]
# Use the Google docstring convention
convention = "google"

# Make formatter match black
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
